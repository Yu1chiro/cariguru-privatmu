<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Teacher</title>
  <link rel="shortcut icon" href="https://i.pinimg.com/736x/f6/7e/ec/f67eec554efb57aad2e6b843ee95be8e.jpg" type="image/x-icon">
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { 
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .white {
        color: white!important;
    }
    #loginButton {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }
    #authModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 2000;
    }
  </style>
</head>
<body>
    <div id="promoPopup" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-11/12 md:w-1/2 lg:w-1/3 p-6 relative">
        <div class="flex justify-center mb-3">
            <img src="https://i.pinimg.com/736x/f6/7e/ec/f67eec554efb57aad2e6b843ee95be8e.jpg" width="100px" height="auto" class="border border-1 border-gray-600 rounded-full" alt="">
        </div>
          <div class="text-center">
            <h2 class="text-2xl font-bold text-blue-600 mb-4">Welcome to FindTeacher</h2>
            <p class="text-gray-700 mb-6">Yuk Cari Guru Privat Favoritmu Sesuai Kebutuhan</p>
            <div class="flex justify-center space-x-4">
              <button id="closePopup" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition duration-300">
                Find Now 🚀
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <script>
        document.addEventListener('DOMContentLoaded', function() {
          const promoPopup = document.getElementById('promoPopup');
          const closePopup = document.getElementById('closePopup');
          
          // Cek local storage
          if (localStorage.getItem('popupClosed') !== 'true') {
            // Tampilkan popup setelah 1 detik
            setTimeout(() => {
              promoPopup.classList.remove('hidden');
            }, 1000);
          }
          
          // Close button handler
          closePopup.addEventListener('click', function() {
            promoPopup.classList.add('hidden');
            localStorage.setItem('popupClosed', 'true');
          });
          
          // Close ketika klik di luar popup
          promoPopup.addEventListener('click', function(e) {
            if (e.target === promoPopup) {
              promoPopup.classList.add('hidden');
              localStorage.setItem('popupClosed', 'true');
            }
          });
        });
      </script>
      <div class="fixed z-40 bg-white rounded-lg shadow-md 
      top-2 right-2 w-[calc(100%-1rem)] p-2
      md:top-4 md:right-4 md:w-80 md:p-4">
<div class="flex items-center mb-3 md:mb-4">
<input type="text" id="searchInput" placeholder="Cari berdasarkan nama kursus..." 
     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500
            text-sm md:text-base">
</div>
<div class="mb-3 md:mb-4">
<label for="educationFilter" class="block font-medium text-gray-700 mb-1 text-xs md:text-sm">
Filter Pendidikan:
</label>
<select id="educationFilter" 
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500
             text-sm md:text-base">
<option value="">Semua Pendidikan</option>
<option value="S1 Pendidikan Bahasa Jepang">S1 Pendidikan Bahasa Jepang</option>
<option value="S1 Pendidikan Bahasa Inggris">S1 Pendidikan Bahasa Inggris</option>
<option value="S1 Pendidikan">S1 Pendidikan</option>
</select>
</div>
<button id="searchButton" 
    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold rounded
           py-1 px-2 text-sm md:py-2 md:px-4 md:text-base">
Cari
</button>
</div>
  <div id="map"></div>
  
  <button id="loginButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
    Daftarkan Kursus
  </button>

  <div id="authModal" class="flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-80">
      <h2 class="text-xl font-bold mb-4">Login dengan Google</h2>
      <div id="googleLogin" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded flex items-center justify-center cursor-pointer">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12.545 10.239v3.821h5.445c-0.712 2.315-2.647 3.972-5.445 3.972-3.332 0-6.033-2.701-6.033-6.032s2.701-6.032 6.033-6.032c1.498 0 2.866 0.549 3.921 1.453l2.814-2.814c-1.786-1.667-4.161-2.674-6.735-2.674-5.522 0-10 4.477-10 10s4.478 10 10 10c8.396 0 10-7.524 10-10 0-0.61-0.042-1.21-0.126-1.791h-9.874z"></path>
        </svg>
        Login dengan Google
      </div>
      <button id="closeModal" class="mt-4 w-full bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-4 rounded">
        Tutup
      </button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Firebase SDK -->
  
  
  <script src="js/map.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
